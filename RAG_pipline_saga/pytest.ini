[pytest]
# Categories, so a slow or load-sensitive class of test can be run — or
# excluded — on its own. A saturated model pool makes latency and concurrency
# tests flap; letting that flap mix into the correctness run is how a capacity
# problem gets mistaken for a correctness failure.
#
#   pytest -m "not load"          everything that is not load-sensitive
#   pytest -m security            the boundary tests alone
#   pytest -m "concurrency"       the ones that need real threads
markers =
    security: tenant, district, permission and manipulation boundaries
    concurrency: needs real threads; sensitive to a loaded machine
    latency: measures time; meaningless on a saturated machine
    load: drives the model or connection pools to saturation on purpose
    live: needs MongoDB, Ollama or the network
